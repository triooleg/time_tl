name: time-tl-bot

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: time-tl-bot:${TIME_TL_IMAGE_TAG:?TIME_TL_IMAGE_TAG must be an immutable release tag}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &base-env
    TIME_TL_ENV: ${TIME_TL_ENV:-simulation}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    TZ: ${TZ:-Europe/Kyiv}
    ALERT_POLL_INTERVAL_SECONDS: ${ALERT_POLL_INTERVAL_SECONDS:-15}
    ALERT_RATE_LIMIT_PER_MINUTE: ${ALERT_RATE_LIMIT_PER_MINUTE:-5}
    ALERT_RATE_LIMIT_BURST: ${ALERT_RATE_LIMIT_BURST:-1}
    ALERT_STALE_AFTER_SECONDS: ${ALERT_STALE_AFTER_SECONDS:-120}
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    HEALTH_HOST: 0.0.0.0
    HEALTH_PORT: 8080
    RUNTIME_STATE_DIR: /var/lib/time-tl-runtime
    SCHEDULE_WORKER_INTERVAL_SECONDS: ${SCHEDULE_WORKER_INTERVAL_SECONDS:-30}
    SENDER_WORKER_INTERVAL_SECONDS: ${SENDER_WORKER_INTERVAL_SECONDS:-2}
    SENDER_MESSAGES_PER_SECOND: ${SENDER_MESSAGES_PER_SECOND:-20}
    SENDER_TRANSPORT_TIMEOUT_SECONDS: ${SENDER_TRANSPORT_TIMEOUT_SECONDS:-8}
    ALLOW_SCAFFOLD_SERVICES: ${ALLOW_SCAFFOLD_SERVICES:-false}
    OWNER_CONFIG_SOURCE: ${OWNER_CONFIG_SOURCE:-environment}
  depends_on:
    postgres: {condition: service_healthy}
  networks: [egress, database]
  healthcheck:
    test: ["CMD", "python", "-m", "time_tl.entrypoints.healthcheck"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  bot:
    <<: *app
    command: ["bot"]
    environment:
      <<: *base-env
      SERVICE_ROLE: bot
      ALERT_PROVIDER: fake
      TELEGRAM_TRANSPORT: ${TELEGRAM_TRANSPORT:-disabled}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      OWNER_TELEGRAM_FERNET_KEY: ${OWNER_TELEGRAM_FERNET_KEY:-}
      LESSON_LINK_FERNET_KEY: ${LESSON_LINK_FERNET_KEY:-}
      TEST_CHAT_ALLOWLIST: ${TEST_CHAT_ALLOWLIST:-}
    deploy: {replicas: 1}

  alert-worker:
    <<: *app
    command: ["alert-worker"]
    environment:
      <<: *base-env
      SERVICE_ROLE: alert-worker
      ALERT_PROVIDER: ${ALERT_PROVIDER:-fake}
      ALERTS_IN_UA_TOKEN: ${ALERTS_IN_UA_TOKEN:-}
      OWNER_ALERTS_FERNET_KEY: ${OWNER_ALERTS_FERNET_KEY:-}
      TELEGRAM_TRANSPORT: disabled
    volumes:
      - runtime-state:/var/lib/time-tl-runtime
    deploy: {replicas: 1}

  schedule-worker:
    <<: *app
    command: ["schedule-worker"]
    environment:
      <<: *base-env
      SERVICE_ROLE: schedule-worker
      ALERT_PROVIDER: fake
      TELEGRAM_TRANSPORT: disabled
      LESSON_LINK_FERNET_KEY: ${LESSON_LINK_FERNET_KEY:-}
    deploy: {replicas: 1}

  sender-worker:
    <<: *app
    command: ["sender-worker"]
    environment:
      <<: *base-env
      SERVICE_ROLE: sender-worker
      ALERT_PROVIDER: fake
      TELEGRAM_TRANSPORT: ${TELEGRAM_TRANSPORT:-disabled}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      OWNER_TELEGRAM_FERNET_KEY: ${OWNER_TELEGRAM_FERNET_KEY:-}
      LESSON_LINK_FERNET_KEY: ${LESSON_LINK_FERNET_KEY:-}
      TEST_CHAT_ALLOWLIST: ${TEST_CHAT_ALLOWLIST:-}
    deploy: {replicas: 1}

  admin-web:
    <<: *app
    command: ["admin-web"]
    environment:
      <<: *base-env
      SERVICE_ROLE: admin-web
      ALERT_PROVIDER: fake
      TELEGRAM_TRANSPORT: disabled
      ALLOW_SCAFFOLD_SERVICES: "false"
      ADMIN_BACKEND: ${ADMIN_BACKEND:-local_sqlite}
      ADMIN_IP_HASH_KEY: ${ADMIN_IP_HASH_KEY:-}
      OWNER_TELEGRAM_FERNET_KEY: ${OWNER_TELEGRAM_FERNET_KEY:-}
      OWNER_ALERTS_FERNET_KEY: ${OWNER_ALERTS_FERNET_KEY:-}
      HOST_METRICS_URL: ${HOST_METRICS_URL:-http://node-exporter:9100/metrics}
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 8081
      HEALTH_PORT: 8081
      HEALTH_PATH: /login
      ADMIN_STATE_DIR: /var/lib/time-tl-admin
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_TRUSTED_PROXY_CIDRS: ${ADMIN_TRUSTED_PROXY_CIDRS:-}
      ADMIN_BOOTSTRAP_ARTIFACT_PATH: /var/lib/time-tl-admin/admin-bootstrap.txt
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-8081}:8081"
    volumes:
      - admin-state:/var/lib/time-tl-admin
    networks: [egress, database, metrics]

  migrate:
    <<: *app
    command: ["migrate"]
    profiles: ["ops"]
    restart: "no"
    environment:
      <<: *base-env
      SERVICE_ROLE: migrate
      ALERT_PROVIDER: fake
      TELEGRAM_TRANSPORT: disabled
      ALLOW_SCAFFOLD_SERVICES: "false"
    healthcheck: {disable: true}

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    pid: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks: [metrics]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  egress: {}
  database: {internal: true}
  metrics: {internal: true}
volumes:
  postgres-data: {}
  admin-state: {}
  runtime-state: {}
